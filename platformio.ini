; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5stack-cores3

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:m5stack-cores3]
platform = espressif32@^6.13.0
board = m5stack-cores3
upload_speed = 1500000
build_flags =
	-std=gnu++14
build_unflags =
	-std=gnu++11
lib_deps =
	m5stack/M5Unified@^0.2.22
	h2zero/NimBLE-Arduino@^2.3.0
lib_ignore =
	BLE

; ESP32-P4 has no radio. BLE runs on the ESP32-C6 through ESP-Hosted, using
; the BLE library of the Arduino core
[env:m5stack-tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
board = m5stack-tab5-p4
board_build.partitions = default_16MB.csv
build_flags =
	-DM5VIEW_MAX_LENGTH=4194304
lib_deps =
	m5stack/M5Unified@^0.2.22
lib_ignore =
	NimBLE-Arduino
